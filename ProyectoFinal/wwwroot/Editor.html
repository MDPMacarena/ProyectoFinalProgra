<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Estilos.css" type="text/css" />
    <title>Code Playground - Editor</title>
</head>
<body class="editor-page">
    <header class="editor-header">
        <button id="btnInicio" class="btn-back">← Volver</button>
        <div class="editor-title">
            <h1 id="tipoEditor">HTML</h1>
            <span class="editor-subtitle">Code Playground</span>
        </div>
        <div class="progress-badge">
            <span id="ejercicioActual">1</span>/<span id="totalEjercicios">6</span>
        </div>
    </header>

    <main class="editor-main">
        <aside class="exercise-panel">
            <div class="exercise-card">
                <div class="exercise-header">
                    <h2 id="tituloEjercicio">Cargando ejercicio...</h2>
                    <span class="nivel-badge" id="nivelEjercicio">Principiante</span>
                </div>

                <p class="exercise-description" id="descripcionEjercicio">Por favor espera...</p>

                <div class="exercise-actions">
                    <button id="btnPista" class="btn-hint">
                        <span>💡</span>
                        <span>Ver Pista</span>
                    </button>

                    <div id="pistaContainer" class="hint-container" style="display: none;">
                        <p id="pistaTexto"></p>
                    </div>

                    <button id="btnValidar" class="btn-validate">
                        <span>✓</span>
                        <span>Validar Código</span>
                    </button>

                    <button id="btnSiguiente" class="btn-next" style="display: none;">
                        <span>Siguiente Ejercicio</span>
                        <span>→</span>
                    </button>
                </div>

                <div id="resultadoValidacion" class="validation-result" style="display: none;">
                    <p id="mensajeValidacion" class="validation-message"></p>
                    <div class="progress-bar">
                        <div id="similitudFill" class="progress-fill"></div>
                    </div>
                    <p id="similitudTexto" class="similarity-text"></p>
                </div>
            </div>
        </aside>
        <section class="code-workspace">
            <div class="workspace-panel editor-panel">
                <div class="panel-header">
                    <span class="panel-icon">📝</span>
                    <h3>Tu Código</h3>
                </div>
                <textarea id="codigoEditor" placeholder="Escribe tu código aquí..." spellcheck="false"></textarea>
            </div>

            <div class="workspace-panel preview-panel">
                <div class="panel-header">
                    <span class="panel-icon">👁️</span>
                    <h3>Vista Previa</h3>
                </div>
                <iframe id="preview" sandbox="allow-same-origin allow-scripts"></iframe>
            </div>
        </section>
    </main>
    <script>
        let ejercicios = [];
        let indiceActual = 0;
        let tipo = sessionStorage.getItem("tipo") || "html";
        let completados = 0;

        const tipoEditor = document.querySelector("#tipoEditor");
        const ejercicioActualSpan = document.querySelector("#ejercicioActual");
        const totalEjerciciosSpan = document.querySelector("#totalEjercicios");
        const tituloEjercicio = document.querySelector("#tituloEjercicio");
        const descripcionEjercicio = document.querySelector("#descripcionEjercicio");
        const nivelEjercicio = document.querySelector("#nivelEjercicio");
        const codigoEditor = document.querySelector("#codigoEditor");
        const preview = document.querySelector("#preview");
        const btnValidar = document.querySelector("#btnValidar");
        const btnSiguiente = document.querySelector("#btnSiguiente");
        const btnPista = document.querySelector("#btnPista");
        const pistaContainer = document.querySelector("#pistaContainer");
        const pistaTexto = document.querySelector("#pistaTexto");
        const resultadoValidacion = document.querySelector("#resultadoValidacion");
        const mensajeValidacion = document.querySelector("#mensajeValidacion");
        const similitudFill = document.querySelector("#similitudFill");
        const similitudTexto = document.querySelector("#similitudTexto");
        const btnInicio = document.querySelector("#btnInicio");

        // Verificar tipo
        if (!tipo) {
            location.href = "Index.html";
        } else {
            tipoEditor.textContent = tipo.toUpperCase();
            cargarEjercicios();
        }

        // Cargar ejercicios desde la API
        async function cargarEjercicios() {
            try {
                const response = await fetch(`/api/CodePlayground/${tipo}`);

                if (!response.ok) {
                    throw new Error("Error al cargar ejercicios");
                }

                const data = await response.json();
                ejercicios = data.ejercicios;

                if (ejercicios.length === 0) {
                    alert("No hay ejercicios disponibles");
                    location.href = "Index.html";
                    return;
                }

                totalEjerciciosSpan.textContent = ejercicios.length;
                mostrarEjercicio();
            } catch (error) {
                console.error("Error:", error);
                alert("Error al cargar ejercicios. Verifica que la API esté funcionando.");
                location.href = "Index.html";
            }
        }

        // Mostrar ejercicio actual
        function mostrarEjercicio() {
            if (indiceActual >= ejercicios.length) {
                finalizarPractica();
                return;
            }

            const ejercicio = ejercicios[indiceActual];

            ejercicioActualSpan.textContent = indiceActual + 1;
            tituloEjercicio.textContent = ejercicio.titulo;
            descripcionEjercicio.textContent = ejercicio.descripcion;
            nivelEjercicio.textContent = ejercicio.nivel.charAt(0).toUpperCase() + ejercicio.nivel.slice(1);
            nivelEjercicio.className = 'nivel-badge nivel-' + ejercicio.nivel;

            codigoEditor.value = ejercicio.codigoInicial || "";
            pistaTexto.textContent = ejercicio.pista || "No hay pista disponible";
            pistaContainer.style.display = "none";

            resultadoValidacion.style.display = "none";
            btnSiguiente.style.display = "none";

            // Reactivar botón validar para nuevo ejercicio
            btnValidar.disabled = false;

            actualizarPreview();
        }

        // Actualizar preview en tiempo real
        codigoEditor.addEventListener("input", actualizarPreview);

        function actualizarPreview() {
            const codigo = codigoEditor.value;
            const iframeDoc = preview.contentDocument || preview.contentWindow.document;

            iframeDoc.open();
            iframeDoc.write(codigo);
            iframeDoc.close();
        }

        // Validar código con la API
        btnValidar.addEventListener("click", async function () {
            const codigo = codigoEditor.value.trim();

            if (!codigo) {
                alert("Escribe algo de código primero");
                return;
            }

            const ejercicioId = ejercicios[indiceActual].id;

            try {
                // Deshabilitar botón mientras valida
                btnValidar.disabled = true;

                const response = await fetch("/api/CodePlayground/validar", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        ejercicioId: ejercicioId,
                        codigo: codigo
                    })
                });

                if (!response.ok) {
                    throw new Error("Error al validar");
                }

                const resultado = await response.json();
                mostrarResultado(resultado);

            } catch (error) {
                console.error("Error:", error);
                alert("Error al validar el código");
                btnValidar.disabled = false; // Reactivar si hay error
            }
        });

        // Mostrar resultado de validación (ACTUALIZADO)
        function mostrarResultado(resultado) {
            resultadoValidacion.style.display = "block";
            mensajeValidacion.textContent = resultado.mensaje;

            // Ya no mostrar porcentaje, solo correcto/incorrecto
            if (resultado.esCorrecto) {
                mensajeValidacion.className = "validation-message success";
                similitudFill.className = "progress-fill success";
                similitudFill.style.width = "100%";
                similitudTexto.textContent = "✓ Respuesta correcta";
                completados++; // Sumar acierto
            } else {
                mensajeValidacion.className = "validation-message error";
                similitudFill.className = "progress-fill error";
                similitudFill.style.width = "100%";
                similitudTexto.textContent = "✗ Respuesta incorrecta";
            }

            // Siempre mostrar botón siguiente (pase o no pase)
            btnSiguiente.style.display = "flex";
        }

        // Botón siguiente
        btnSiguiente.addEventListener("click", function () {
            indiceActual++;
            mostrarEjercicio();
        });

        // Botón pista
        btnPista.addEventListener("click", function () {
            pistaContainer.style.display = pistaContainer.style.display === "none" ? "block" : "none";
        });

        // Botón inicio
        btnInicio.addEventListener("click", function () {
            if (confirm("¿Regresar al inicio? Perderás tu progreso")) {
                sessionStorage.clear();
                location.href = "Index.html";
            }
        });

        // Finalizar práctica
        function finalizarPractica() {
            sessionStorage.setItem("completados", completados);
            sessionStorage.setItem("total", ejercicios.length);
            location.href = "Fin.html";
        }
    </script>
</body>
</html>
